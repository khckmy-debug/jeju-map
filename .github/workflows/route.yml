name: Build Route

on:
  push:
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch driving route from Naver Directions 5
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request

          # 방문 순서대로 (경도, 위도)
          stops = [
              (126.4930, 33.5113),  # 제주공항
              (126.4795, 33.4855),  # 88버거 제주공항점 (노형동)
              (126.3096, 33.4614),  # 제주시간여행휴양펜션
              (126.3399, 33.4425),  # 화조원
              (126.3550, 33.4350),  # 통나무파크&도치돌목장
              (126.4100, 33.2500),  # 형제도식당 중문본점
              (126.2370, 33.3380),  # 스테이오제 (한경면 낙천리)
              (126.5450, 33.4650),  # 오멘
              (126.4820, 33.4870),  # 제주소풍김밥
              (126.4850, 33.5090),  # 유동커피 소금공장점 (용담삼동)
              (126.4930, 33.5113),  # 제주공항 (복귀)
          ]

          cid = os.environ.get("NAVER_CLIENT_ID", "")
          csecret = os.environ.get("NAVER_CLIENT_SECRET", "")
          print(f"DEBUG: client id length={len(cid)}, secret length={len(csecret)}")
          if not cid or not csecret:
              raise SystemExit("Secrets NAVER_CLIENT_ID / NAVER_CLIENT_SECRET are empty - check repo Settings > Secrets and variables > Actions")

          legs = []
          for i in range(len(stops) - 1):
              sx, sy = stops[i]
              gx, gy = stops[i + 1]
              url = (
                  "https://maps.apigw.ntruss.com/map-direction/v1/driving"
                  f"?start={sx},{sy}&goal={gx},{gy}&option=trafast"
              )
              req = urllib.request.Request(url, headers={
                  "x-ncp-apigw-api-key-id": cid,
                  "x-ncp-apigw-api-key": csecret,
              })
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  print("=== NAVER API ERROR ===")
                  print("Status:", e.code)
                  print("Body:", body)
                  raise
              route = data["route"]["trafast"][0]
              legs.append({
                  "from_idx": i,
                  "to_idx": i + 1,
                  "distance": route["summary"]["distance"],       # meters
                  "duration": route["summary"]["duration"],       # ms
                  "path": route["path"],                          # [[lng,lat], ...]
              })

          with open("route.json", "w", encoding="utf-8") as f:
              json.dump({"legs": legs}, f)

          total_pts = sum(len(l["path"]) for l in legs)
          print(f"route.json written with {len(legs)} legs, {total_pts} total points")
          EOF

      - name: Commit route.json
        run: |
          git config user.name "route-bot"
          git config user.email "route-bot@users.noreply.github.com"
          git add route.json
          git diff --staged --quiet || git commit -m "Update route.json"
          git push
