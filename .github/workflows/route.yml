name: Build Route

on:
  push:
    paths:
      - 'index.html'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'   # 안전망: 15분마다도 최신 gist 순서로 재계산

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch driving route from Naver Directions 5
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request

          GIST_ID = "47206a4e3e532c3e6102f3840961a77f"
          GIST_FILE = "jeju_itinerary.json"

          # 기본(fallback) 순서 - gist를 못 가져올 때만 사용
          FALLBACK_STOPS = [
              {"id":"airport-arr","day":1,"lat":33.5113,"lng":126.4930},
              {"id":"yudong","day":1,"lat":33.5090,"lng":126.4850},
              {"id":"burger88","day":1,"lat":33.4855,"lng":126.4795},
              {"id":"pension1","day":1,"lat":33.4614,"lng":126.3096},
              {"id":"hwajowon","day":2,"lat":33.4425,"lng":126.3399},
              {"id":"dochidol","day":2,"lat":33.4350,"lng":126.3550},
              {"id":"hyungje","day":3,"lat":33.2500,"lng":126.4100},
              {"id":"stayoje","day":3,"lat":33.3380,"lng":126.2370},
              {"id":"omen","day":4,"lat":33.4650,"lng":126.5450},
              {"id":"sopoong","day":4,"lat":33.4870,"lng":126.4820},
              {"id":"airport-dep","day":4,"lat":33.5113,"lng":126.4930},
          ]

          def fetch_gist_stops():
              req = urllib.request.Request(
                  "https://api.github.com/gists/" + GIST_ID,
                  headers={"Accept": "application/vnd.github+json", "User-Agent": "jeju-map-route-bot"}
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  gist = json.loads(resp.read().decode())
              content = gist["files"][GIST_FILE]["content"]
              stops = json.loads(content)
              if not isinstance(stops, list) or not stops:
                  raise ValueError("empty or invalid gist content")
              return stops

          try:
              raw_stops = fetch_gist_stops()
              print(f"DEBUG: loaded {len(raw_stops)} stops from gist")
          except Exception as e:
              print("WARN: failed to fetch gist, using fallback stops:", e)
              raw_stops = FALLBACK_STOPS

          # index.html의 sortedStops()와 동일한 로직: day 기준 안정 정렬(같은 day는 배열 순서 유지)
          ordered = sorted(enumerate(raw_stops), key=lambda x: (x[1]["day"], x[0]))
          ordered_stops = [item[1] for item in ordered]

          order_ids = [s.get("id", "") for s in ordered_stops]
          stops = [(s["lng"], s["lat"]) for s in ordered_stops]

          cid = os.environ.get("NAVER_CLIENT_ID", "")
          csecret = os.environ.get("NAVER_CLIENT_SECRET", "")
          print(f"DEBUG: client id length={len(cid)}, secret length={len(csecret)}")
          if not cid or not csecret:
              raise SystemExit("Secrets NAVER_CLIENT_ID / NAVER_CLIENT_SECRET are empty - check repo Settings > Secrets and variables > Actions")

          legs = []
          for i in range(len(stops) - 1):
              sx, sy = stops[i]
              gx, gy = stops[i + 1]
              url = (
                  "https://maps.apigw.ntruss.com/map-direction/v1/driving"
                  f"?start={sx},{sy}&goal={gx},{gy}&option=trafast"
              )
              req = urllib.request.Request(url, headers={
                  "x-ncp-apigw-api-key-id": cid,
                  "x-ncp-apigw-api-key": csecret,
              })
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  print("=== NAVER API ERROR ===")
                  print("Status:", e.code)
                  print("Body:", body)
                  raise
              route = data["route"]["trafast"][0]
              legs.append({
                  "from_idx": i,
                  "to_idx": i + 1,
                  "distance": route["summary"]["distance"],       # meters
                  "duration": route["summary"]["duration"],       # ms
                  "path": route["path"],                          # [[lng,lat], ...]
              })

          with open("route.json", "w", encoding="utf-8") as f:
              json.dump({"order": order_ids, "legs": legs}, f)

          total_pts = sum(len(l["path"]) for l in legs)
          print(f"route.json written with {len(legs)} legs, {total_pts} total points, order={order_ids}")
          EOF

      - name: Commit route.json
        run: |
          git config user.name "route-bot"
          git config user.email "route-bot@users.noreply.github.com"
          git add route.json
          git diff --staged --quiet || git commit -m "Update route.json"
          git push
